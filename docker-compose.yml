services:
  ancient-chinese-ner:
    platform: linux/x86_64

    build:
      context: .
      dockerfile: Dockerfile

    container_name: meta-ancient-chinese-ner
    restart: always

    environment:
      - TZ=Asia/Ho_Chi_Minh
      - CHECKPOINT_PATH=/app/checkpoints/best.pt
      - LABEL_MAP_PATH=/app/artifacts/label_map.json

    volumes:
      - ./checkpoints:/app/checkpoints
      - ./artifacts:/app/artifacts
      # HuggingFace models (GuwenBERT + segmentation) are downloaded once and kept here
      - hf-cache:/root/.cache/huggingface

    ports:
      - "9001:8000"

volumes:
  hf-cache:
