# ─────────────────────────────────────────────────────────────────
# DVSK NER — Config (transfer from CHisIEC)
# ─────────────────────────────────────────────────────────────────
project:
  name: "dvsk_ner"
  seed: 42

data:
  train: "data/dvsk/dvsk_train.txt"
  dev:   "data/dvsk/dvsk_dev.txt"
  test:  "data/dvsk/dvsk_test.txt"
  max_len: 128
  
model:
  method: "guwenbert_crf"
  backbone: null
  lstm_hidden: 256
  lstm_layers: 2
  kan_hidden: 512
  kan_knots: 8
  dropout: 0.1
  pretrained_ckpt: "outputs/guwenbert_crf/guwenbert_crf_best.pt"  # ← load từ CHisIEC

training:
  epochs: 20
  batch_size: 16
  bert_lr: 1.0e-5       # ← thấp hơn vì đang fine-tune từ checkpoint
  head_lr: 1.0e-3
  weight_decay: 0.01
  warmup_ratio: 0.1
  grad_clip: 1.0
  fp16: true

early_stopping:
  enabled: true
  patience: 5
  min_delta: 0.001

checkpoint:
  output_dir: "outputs/dvsk"   # ← output riêng, không đè CHisIEC
  save_top_k: 1

logging:
  level: "INFO"
  use_wandb: false
  wandb_project: "dvsk-ner"
  wandb_entity: null
